<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConcertNOW | Community Trips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
</head>
<body class="min-h-screen">

<nav class="bg-white shadow-md sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
        <span class="text-2xl font-extrabold text-purple-600">ConcertNOW</span>
        <div class="space-x-4">
            <a href="/index" class="text-gray-500 hover:text-purple-600 px-3 py-2 text-sm font-medium">Home</a>
            <a href="/itinerary/saved" class="text-gray-500 hover:text-purple-600 px-3 py-2 text-sm font-medium">My Trips</a>
            <a href="/community" class="text-purple-600 font-semibold border-b-2 border-purple-600 px-3 py-2 text-sm">
                Community
            </a>
            <button onclick="handleLogout()"
                    class="text-gray-500 hover:text-red-500 px-3 py-2 rounded-md text-sm font-medium">
                Log Out
            </button>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto p-6 lg:p-12">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Community Shared Trips</h1>
    <p class="text-lg text-gray-600 mb-8">Discover public itineraries created by other users.</p>

    <div class="bg-white p-6 rounded-xl shadow-lg mb-8 flex flex-col md:flex-row md:space-x-4 space-y-4 md:space-y-0">
        <input type="text" id="filter-city" placeholder="Filter by City..."
               class="p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 md:w-1/3 w-full">
        <input type="text" id="filter-artist" placeholder="Filter by Artist..."
               class="p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 md:w-1/3 w-full">

        <button onclick="fetchCommunityTrips()"
                class="py-2 px-4 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">
            Search
        </button>

        <button onclick="clearFilters()"
                class="py-2 px-4 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition">
            Clear Filters
        </button>
    </div>

    <div id="loading-message" class="text-center py-10 text-xl text-gray-500">
        Loading community itineraries...
    </div>

    <div id="community-trips-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    </div>
</main>

<script>
const API_BASE_URL = '/api';

document.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('concertNowUserId')) {
        window.location.href = '/';
        return;
    }

    fetchCommunityTrips();

    const cityInput = document.getElementById('filter-city');
    const artistInput = document.getElementById('filter-artist');

    [cityInput, artistInput].forEach(inp => {
        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                fetchCommunityTrips();
            }
        });
    });
});

function handleLogout() {
    localStorage.removeItem('concertNowFirstName');
    localStorage.removeItem('concertNowUserId');
    window.location.href = '/';
}

function clearFilters() {
    document.getElementById('filter-city').value = '';
    document.getElementById('filter-artist').value = '';
    fetchCommunityTrips();
}

async function fetchCommunityTrips() {
    const container = document.getElementById('community-trips-container');
    const loadingMessage = document.getElementById('loading-message');

    const city = document.getElementById('filter-city').value.trim();
    const artist = document.getElementById('filter-artist').value.trim();

    const params = new URLSearchParams();
    if (city) params.append('city', city);
    if (artist) params.append('artist', artist);

    let url = `${API_BASE_URL}/trips/community`;
    const qs = params.toString();
    if (qs) url += `?${qs}`;

    container.innerHTML = '';
    loadingMessage.classList.remove('hidden');
    loadingMessage.textContent = 'Loading community itineraries...';

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (response.ok && data.trips && data.trips.length > 0) {
            renderCommunityTrips(data.trips);
            loadingMessage.classList.add('hidden');
        } else {
            loadingMessage.innerHTML = `
                <div class="col-span-full text-center p-10 bg-white rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold text-gray-700">No Public Trips Found!</h2>
                    <p class="text-gray-500 mt-2">Try clearing your filters or be the first to share your plan.</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('Error fetching community trips:', error);
        loadingMessage.innerHTML = `
            <div class="col-span-full text-center py-10 text-xl text-red-500">
                ❌ Network Error: Could not load community trips.
            </div>`;
    }
}

function renderCommunityTrips(trips) {
    const container = document.getElementById('community-trips-container');
    container.innerHTML = '';

    trips.forEach(trip => {
        const hotelHtml = trip.HotelName
            ? `<p class="text-sm font-semibold text-purple-600">
                   🏨 ${trip.HotelName} (${trip.StarRating ?? 0} Star)
               </p>`
            : '<p class="text-sm text-gray-500">❌ No hotel included</p>';

        const card = document.createElement('div');
        card.className = 'trip-card bg-white p-6 rounded-xl shadow-lg border-t-8 border-indigo-500';

        card.innerHTML = `
            <p class="text-xs font-semibold text-gray-500 mb-1">
                Shared by: ${trip.FirstName} ${trip.LastName ? trip.LastName[0] + '.' : ''}
            </p>

            <h3 class="text-2xl font-bold text-gray-800 mb-3">${trip.EventName}</h3>

            <div class="space-y-3 text-gray-600 border-b pb-4 mb-4">
                <p class="flex items-center text-sm">
                    <span class="font-medium w-20 text-gray-500">Date:</span> ${trip.EventDate}
                </p>
                <p class="flex items-center text-sm">
                    <span class="font-medium w-20 text-gray-500">Venue:</span> ${trip.VenueName} (${trip.VenueCity})
                </p>
                <p class="flex items-center text-sm">
                    <span class="font-medium w-20 text-gray-500">Stay:</span> ${hotelHtml}
                </p>
            </div>

            ${trip.UserNote ? `
                <p class="text-sm text-gray-700 italic border-l-4 pl-3 py-1 mt-3 mb-4">
                    "${trip.UserNote}"
                </p>` : '' }

            <div class="flex justify-end">
                <button onclick="saveCommunityTrip(${trip.TripId})"
                        class="py-2 px-4 bg-red-600 text-white text-sm font-semibold rounded-lg hover:bg-red-700 transition duration-150 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M5 4a2 2 0 00-2 2v6a2 2 0 002 2h6a2 2 0 002-2V6a2 2 0 00-2-2H5z"></path>
                        <path d="M15 12h-2a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2v3a2 2 0 01-2 2z"></path>
                    </svg>
                    Save to My Trips
                </button>
            </div>
        `;
        container.appendChild(card);
    });
}

async function saveCommunityTrip(tripId) {
    const userId = localStorage.getItem('concertNowUserId');
    if (!userId) {
        alert('Please sign in first.');
        window.location.href = '/';
        return;
    }

    if (!confirm(`Save Community Trip #${tripId} to My Trips?`)) {
        return;
    }

    try {
        const resp = await fetch(`${API_BASE_URL}/trips/${tripId}/copy`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({userId})
        });

        const data = await resp.json();

        if (resp.ok) {
            alert('✅ Trip saved to My Trips!');
        } else if (resp.status === 409) {
            alert(data.message || 'You already have this trip in your trips.');
        } else {
            alert(data.message || 'Failed to save trip.');
        }
    } catch (err) {
        console.error('Error copying trip:', err);
        alert('Network error while saving trip.');
    }
}
</script>
</body>
</html>
