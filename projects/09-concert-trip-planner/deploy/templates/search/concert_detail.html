<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ConcertNOW | Concert Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c1222;
            color: #e5e7eb;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
        }
    </style>
</head>

<body class="min-h-screen">

<!-- NAV -->
<nav class="bg-gray-900 shadow-md sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
        <span class="text-2xl font-extrabold text-purple-400">ConcertNOW</span>

        <div class="flex space-x-4 text-sm">
            <a href="/index" class="text-gray-400 hover:text-purple-400 px-3 py-2">Home</a>
            <a href="/concerts" class="text-purple-400 font-semibold border-b-2 border-purple-400 px-3 py-2">
                Concert Results
            </a>
            <a href="/itinerary/saved" class="text-gray-400 hover:text-purple-400 px-3 py-2">My Trips</a>
            <a href="/community" class="text-gray-400 hover:text-purple-400 px-3 py-2">Community</a>
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="max-w-5xl mx-auto p-6 lg:p-10">

    <!-- EVENT DETAILS -->
    <section class="card p-6 rounded-xl mb-10">
        <h1 id="event-name" class="text-3xl font-bold mb-3"></h1>
        <p id="event-venue" class="text-gray-300 mb-1"></p>
        <p id="event-datetime" class="text-gray-400 mb-4"></p>

        <a id="event-url" href="#" target="_blank"
           class="text-sm text-purple-300 underline mb-4 block"></a>

        <button id="add-concert-only"
                class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded-lg transition">
            Add Concert Only
        </button>
    </section>

    <!-- HOTEL LIST -->
    <h2 class="text-xl font-semibold mb-4">Nearby Hotels</h2>

    <div id="hotel-list" class="space-y-4"></div>

</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("eventId");

    if (!eventId) return;

    const userId = localStorage.getItem("concertNowUserId");
    const firstName = localStorage.getItem("concertNowFirstName");

    if (!userId) {
        window.location.href = "/";
        return;
    }

    // Fetch event details
    const eventRes = await fetch(`/api/events/${eventId}`);
    const eventData = await eventRes.json();

    document.getElementById("event-name").textContent = eventData.EventName;
    document.getElementById("event-venue").textContent =
        `${eventData.VenueName}, ${eventData.City}`;
    document.getElementById("event-datetime").textContent =
        `${eventData.EventDate} • ${eventData.EventTime}`;
    document.getElementById("event-url").textContent = "Event Ticket Link";
    document.getElementById("event-url").href = eventData.URL || "#";

    // Button: Add concert only
    document.getElementById("add-concert-only").onclick = async () => {
        const payload = {
            userId,
            eventId,
            hotelCode: null,
            note: null,
            visibility: 1
        };

        const res = await fetch("/api/itinerary", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload),
        });

        const data = await res.json();
        alert(data.message);
    };

    // Fetch hotels
    const hotelsRes = await fetch(`/api/hotels/${eventId}`);
    const hotelsData = await hotelsRes.json();

    const hotelList = document.getElementById("hotel-list");
    hotelList.innerHTML = "";

    hotelsData.hotels.forEach(hotel => {
        const rating = hotel.StarRating ? `${hotel.StarRating} ★` : "N/A";

        const div = document.createElement("div");
        div.className = "card rounded-xl p-5 flex justify-between items-center";

        div.innerHTML = `
            <div>
                <h3 class="text-lg font-bold">${hotel.Name}</h3>
                <p class="text-gray-300 text-sm">${hotel.Address}</p>
                <p class="text-gray-400 text-sm">${rating}</p>
                <a href="${hotel.URL || '#'}" target="_blank" class="text-purple-300 underline text-sm mt-2 block">
                    Hotel Website
                </a>
            </div>

            <button class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                Add to Itinerary
            </button>
        `;

        div.querySelector("button").onclick = async () => {
            const payload = {
                userId,
                eventId,
                hotelCode: hotel.HotelCode,
                note: null,
                visibility: 1
            };

            const res = await fetch("/api/itinerary", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload),
            });

            const data = await res.json();
            alert(data.message);
        };

        hotelList.appendChild(div);
    });

});
</script>

</body>
</html>
