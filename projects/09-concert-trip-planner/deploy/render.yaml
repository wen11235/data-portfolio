services:
  - type: web
    name: concertnow
    runtime: python
    rootDir: projects/09-concert-trip-planner/deploy
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    # No env vars needed — the database is a bundled SQLite file
    # (concertnow.db), created automatically on first run. See
    # README.md's "Live deployment" section for why (MySQL free-tier
    # hosting turned out to be unreliable).
